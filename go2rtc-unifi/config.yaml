name: go2rtc UniFi Talkback
version: "0.1.2"
slug: go2rtc_unifi
description: Separate go2rtc built from unreleased pull request 2340 for live two way audio to UniFi Protect camera speakers
url: https://github.com/AlexxIT/go2rtc/pull/2340
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: manual
ports:
  1984/tcp: 1984
  8554/tcp: 8554
  8555/tcp: 8555
  8555/udp: 8555
ports_description:
  1984/tcp: go2rtc web interface and API
  8554/tcp: RTSP
  8555/tcp: WebRTC
  8555/udp: WebRTC
options:
  console_host: ""
  api_key: ""
  camera_id: ""
  camera_name: ""
  rtsp_alias: ""
  stream_name: doorbell
schema:
  console_host: str
  api_key: password
  camera_id: str?
  camera_name: str?
  rtsp_alias: str?
  stream_name: str
