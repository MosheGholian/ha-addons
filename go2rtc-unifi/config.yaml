name: UniFi Talkback Relay
version: "0.4.0"
slug: go2rtc_unifi
description: Lets a Home Assistant dashboard talk through a UniFi Protect camera speaker over the normal secure Home Assistant address
url: https://github.com/MosheGholian/ha-addons
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_admin: false
options:
  console_host: ""
  api_key: ""
  camera_id: ""
  camera_name: ""
schema:
  console_host: str
  api_key: password
  camera_id: str?
  camera_name: str?
  rtsp_alias: str?
  stream_name: str?
  candidates:
    - str?
