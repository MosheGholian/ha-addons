name: go2rtc UniFi Talkback
version: "0.2.0"
slug: go2rtc_unifi
description: Separate go2rtc built from unreleased pull request 2340 for live two way audio to UniFi Protect camera speakers
url: https://github.com/AlexxIT/go2rtc/pull/2340
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: manual
ingress: true
ingress_port: 1984
ingress_entry: /webrtc.html?src=doorbell&media=microphone
panel_admin: false
ports:
  8555/tcp: 8555
  8555/udp: 8555
ports_description:
  8555/tcp: WebRTC
  8555/udp: WebRTC
options:
  console_host: ""
  api_key: ""
  camera_id: ""
  camera_name: ""
  rtsp_alias: ""
  stream_name: doorbell
  candidates:
    - 192.168.1.241:8555
    - 100.111.211.98:8555
schema:
  console_host: str
  api_key: password
  camera_id: str?
  camera_name: str?
  rtsp_alias: str?
  stream_name: str
  candidates:
    - str
